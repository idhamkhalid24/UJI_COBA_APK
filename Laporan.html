    *{box-sizing:border-box;margin:0;padding:0} body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh} button,input,select{font-family:inherit}.app{max-width:1180px;margin:0 auto;padding:18px 14px 92px}.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:14px}.brand{display:flex;gap:12px;align-items:center}.logo{width:46px;height:46px;border-radius:14px;background:var(--green);color:white;display:grid;place-items:center;font-weight:900;box-shadow:0 10px 24px rgba(0,168,120,.24)}h1{font-size:22px;line-height:1.1} .sub{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.35}.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.btn{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:10px;padding:10px 12px;font-size:12px;font-weight:800;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px;box-shadow:var(--shadow)}.btn:active{transform:scale(.98)}.btn.primary{background:var(--green);border-color:var(--green);color:white}.btn.success{background:var(--green);border-color:var(--green);color:white}.btn.danger{background:rgba(232,93,93,.10);border-color:rgba(232,93,93,.25);color:var(--red)}.btn.ghost{box-shadow:none}.tabs{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);z-index:30;width:calc(100% - 24px);max-width:620px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:7px;box-shadow:0 -8px 28px rgba(15,40,50,.10);display:grid;grid-template-columns:repeat(6,1fr);gap:5px}.tab{border:0;background:transparent;color:var(--muted);border-radius:13px;padding:9px 5px;font-size:10px;font-weight:900;display:flex;flex-direction:column;gap:4px;align-items:center;cursor:pointer}.tab i{font-size:17px}.tab.active{background:var(--green);color:white}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:14px}.hero{border-top:4px solid var(--green)}.klabel{font-size:11px;color:var(--muted);font-weight:800;margin-bottom:6px}.kvalue{font-family:var(--num);font-size:24px;font-weight:900;line-height:1.1}.muted{color:var(--muted)}.small{font-size:11px;line-height:1.4}.input{width:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 11px;color:var(--text);font-size:13px;outline:none}.input:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(0,168,120,.12)}.section{display:none}.section.active{display:block}.toolbar{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:10px}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--card);box-shadow:var(--shadow)}table{width:100%;border-collapse:collapse;min-width:760px}th,td{padding:10px 11px;border-bottom:1px solid var(--line);text-align:left;font-size:12px;white-space:nowrap}th{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:rgba(127,127,127,.04)}td.num{text-align:right;font-variant-numeric:tabular-nums}.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 9px;font-size:11px;font-weight:900;border:1px solid var(--line);background:var(--card);color:var(--muted)}.pill.ok{background:var(--soft);border-color:rgba(0,168,120,.25);color:var(--green2)}.pill.warn{background:rgba(251,191,36,.12);border-color:rgba(251,191,36,.25);color:var(--amber)}.status{font-size:12px;line-height:1.45;margin-top:10px;color:var(--muted)}.split{display:grid;grid-template-columns:1fr 1fr;gap:10px}.file{display:none}@media(max-width:760px){.app{padding:14px 10px 92px}.top{flex-direction:column}.actions{width:100%;justify-content:stretch}.actions .btn{flex:1}.grid,.grid2,.split{grid-template-columns:1fr 1fr}h1{font-size:20px}.kvalue{font-size:20px}.card{padding:12px}.tabs{grid-template-columns:repeat(6,1fr)}.tab span{font-size:9px}.toolbar{align-items:stretch}.toolbar>div{width:100%}}@media(max-width:420px){.grid,.grid2,.split{grid-template-columns:1fr}.actions{display:grid;grid-template-columns:1fr 1fr}.btn{padding:10px 9px}.top{gap:9px}}

    .filters{display:grid;grid-template-columns:1.2fr 1fr 1fr 1.2fr 1.2fr;gap:8px;margin-bottom:10px}

    /* === V1.2.3: GRAFIK BULANAN DI HOME === */
    .chart-card{margin:0 0 10px!important;overflow:hidden}
    .chart-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:10px}
    .chart-title{font-size:13px;font-weight:900;color:var(--text);line-height:1.2}
    .chart-sub{font-size:11px;color:var(--muted);margin-top:3px;line-height:1.35}
    .chart-bars{height:188px;display:grid;grid-template-columns:repeat(12,minmax(34px,1fr));gap:7px;align-items:end;border-top:1px solid var(--line);padding:13px 2px 4px;overflow-x:auto;scrollbar-width:thin}
    .chart-col{height:100%;min-width:34px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:5px}

    .chart-bar{width:100%;max-width:34px;min-height:5px;border-radius:999px 999px 4px 4px;background:linear-gradient(180deg,var(--green),var(--green2));box-shadow:0 8px 18px rgba(0,168,120,.16)}

    /* === V1.2.4: UI ANDROID RESPONSIVE CLEAN === */

    body{touch-action:manipulation;overscroll-behavior-y:none;-webkit-tap-highlight-color:transparent;padding-top:env(safe-area-inset-top,0px)}
    .btn,.tab,input,select,textarea{min-height:44px}
    .btn{white-space:nowrap;line-height:1.1}
    .card,.report-card,.month-card,.tablewrap,.modal-card{backdrop-filter:saturate(1.08)}
    .section{animation:androidFade .14s ease both}
    @keyframes androidFade{from{opacity:.86;transform:translateY(5px)}to{opacity:1;transform:none}}

    /* === V1.2.7: LAPORAN KEUANGAN + GRAFIK PENGELUARAN === */

async function mobileBulkPut(collection,rows){

async function api(path, opts={}){ const method=String(opts.method||'GET').toUpperCase(); const body=opts.body?JSON.parse(opts.body):{}; let m=path.match(/^\/api\/store\/([^/]+)(?:\/([^/]+))?/); if(m){ const collection=decodeURIComponent(m[1]); const id=m[2]?decodeURIComponent(m[2]):''; if(method==='GET') return id?{ok:true,record:await mobileGet(collection,id)}:{ok:true,records:await mobileGetAll(collection)}; if(method==='POST') return await mobilePut(collection,id,body.data||{}); if(method==='DELETE') return await mobileDelete(collection,id); } if(path==='/api/import-backup'&&method==='POST') return await mobileImportBackup(body); if((path==='/api/delete-all'||path==='/api/reset-all')&&(method==='POST'||method==='DELETE')){ const deleted=await mobileDeleteAll(); return {ok:true,deleted}; } if(path==='/api/delete-month'&&method==='POST'){ const deleted=await mobileDeleteByMonth(String(body.monthKey||'').slice(0,7)); return {ok:true,monthKey:body.monthKey,deleted}; } throw new Error('Endpoint lokal HP tidak dikenal: '+path); }

function yearlyChartCard(year=state.year){
  const y = String(year || new Date().getFullYear()).slice(0,4);
  const rows = Array.from({length:12},(_,i)=>{
    const m = `${y}-${String(i+1).padStart(2,'0')}`;
    const totals = buildReport('month',m).totals;
    const expenseItems = expenseRowsForMonth(m);
    return {
      m,
      label: monthShort(m),
      omzet: Number(totals.omzet||0),
      transaksi: Number(totals.transaksi||0),
      pengeluaran: expenseTotal(expenseItems),
      expenseCount: expenseItems.length
    };
  });
  const max = Math.max(1, ...rows.map(r=>Math.max(r.omzet,r.pengeluaran)));
  const totalOmzet = rows.reduce((a,b)=>a+b.omzet,0);
  const totalPengeluaran = rows.reduce((a,b)=>a+b.pengeluaran,0);
  const totalTrx = rows.reduce((a,b)=>a+b.transaksi,0);
  const best = rows.reduce((a,b)=> b.omzet > a.omzet ? b : a, rows[0] || {label:'-',omzet:0});
  const bengkak = rows.reduce((a,b)=> b.pengeluaran > a.pengeluaran ? b : a, rows[0] || {label:'-',pengeluaran:0});
  return `<div class="card chart-card dual-chart">
    <div class="chart-head">
      <div><div class="chart-title"><i class="fas fa-chart-column"></i> Grafik Omzet & Pengeluaran ${esc(y)}</div><div class="chart-sub">Hijau = omset bulanan dari laporan. Merah = pengeluaran KASM dari arsip lokal terakhir. Update data dilakukan manual lewat tombol <b>Sync Semua</b> di atas agar tidak boros read.</div></div>
      <div class="chart-actions"><input class="input" type="number" value="${esc(y)}" onchange="state.year=String(this.value||new Date().getFullYear()).slice(0,4);state.finance.year=state.year;if(!state.finance.month.startsWith(state.year))state.finance.month=state.year+'-01';renderAll()"><span class="pill warn"><i class="fas fa-database"></i> Manual dari Sync Semua</span></div>
    </div>
    <div class="chart-bars">${rows.map(r=>{
      const ho = r.omzet>0 ? Math.max(5, Math.round((r.omzet / max) * 120)) : 0;
      const hp = r.pengeluaran>0 ? Math.max(5, Math.round((r.pengeluaran / max) * 120)) : 0;
      return `<div class="chart-col" title="${esc(monthName(r.m))}: Omset Rp ${rupiah(r.omzet)} · Pengeluaran Rp ${rupiah(r.pengeluaran)}"><div class="chart-bar-wrap"><div class="chart-bar ${r.omzet?'':'empty'}" style="height:${ho}px"></div><div class="chart-bar expense ${r.pengeluaran?'':'empty'}" style="height:${hp}px"></div></div><div class="chart-month">${esc(r.label)}</div><div class="chart-value">O ${num(r.transaksi)} · P ${num(r.expenseCount)}</div></div>`;
    }).join('')}</div>
    <div class="chart-legend"><span class="pill ok"><span class="legend-dot"></span>Omset Rp ${rupiah(totalOmzet)}</span><span class="pill warn"><span class="legend-dot red"></span>Pengeluaran Rp ${rupiah(totalPengeluaran)}</span><span class="pill">${num(totalTrx)} transaksi</span><span class="pill warn">Bengkak ${esc(bengkak.label)} · Rp ${rupiah(bengkak.pengeluaran)}</span><span class="pill ok">Omset tertinggi ${esc(best.label)} · Rp ${rupiah(best.omzet)}</span></div>
  </div>`;
}

function getPusatSupabase(){
  if(pusatSupabaseClient) return pusatSupabaseClient;
  if(!window.supabase || typeof window.supabase.createClient !== 'function') throw new Error('Supabase client belum siap untuk Pusat Original');
  pusatSupabaseClient = window.supabase.createClient(PUSAT_SUPABASE_URL, PUSAT_SUPABASE_ANON_KEY);
  return pusatSupabaseClient;
}
function getKasmSupabase(){
  if(kasmSupabaseClient) return kasmSupabaseClient;
  if(!window.supabase || !window.supabase.createClient) throw new Error('Library Supabase belum termuat. Coba online lalu refresh halaman.');
  kasmSupabaseClient = window.supabase.createClient(KASM_SUPABASE_URL, KASM_SUPABASE_ANON_KEY);
  return kasmSupabaseClient;
}
function kasmDate(t){ return String(t?.date || '').slice(0,10); }
function kasmMonth(t){ const d=kasmDate(t); return d ? d.slice(0,7) : ''; }
function isKasmCashOut(t){ return t && String(t.type||'') === 'expense' && String(t.description||'').startsWith('[CASHOUT:'); }
function isKasmOpsExpense(t){ return t && String(t.description||'').startsWith('[OPS] '); }
function cleanKasmExpenseDesc(v){ return String(v||'Pengeluaran').replace(/^\[OPS\]\s*/,'').replace(/^\[CASHOUT:[^\]]+\]\s*/,'').trim() || 'Pengeluaran'; }
function normalizeKasmExpense(row={}){ return { id:Number(row.id||0), date:kasmDate(row), description:String(row.description||''), amount:Number(row.amount||0), type:String(row.type||'expense') }; }
function expenseCategory(t){ return isKasmOpsExpense(t) ? 'Operasional Toko' : 'Pengeluaran Lainnya'; }
function allKasmExpenseRows(){ return (Array.isArray(state.kasm_expenses) && state.kasm_expenses.length ? state.kasm_expenses : (state.expenses.rows||[])).map(normalizeKasmExpense).filter(t=>t.date && t.type==='expense' && !isKasmCashOut(t)); }
function expenseRowsForYear(year=state.expenses.year){ const y=String(year||'').slice(0,4); return allKasmExpenseRows().filter(t=>kasmDate(t).startsWith(y)); }
function expenseRowsForMonth(month=state.expenses.month){ const m=String(month||'').slice(0,7); return allKasmExpenseRows().filter(t=>kasmDate(t).startsWith(m)); }
function filterExpenseRows(rows){ const q=String(state.expenses.q||'').trim().toLowerCase(); if(!q) return rows; return rows.filter(t=>[cleanKasmExpenseDesc(t.description), expenseCategory(t), t.date, t.id, t.amount].join(' ').toLowerCase().includes(q)); }
function expenseTotal(rows){ return rows.reduce((s,t)=>s+Number(t.amount||0),0); }
function expenseMonthLabel(month){ return monthName(month); }
function expenseStat(label,value,sub='',icon='fa-receipt'){ return dataStatCard(label,value,sub,icon); }
function expenseEmpty(message='Belum ada pengeluaran pada periode ini.'){ return `<div class="data-empty-card"><i class="fas fa-receipt"></i><div><b>${esc(message)}</b></div><div class="small" style="margin-top:4px">Klik tombol Sync Semua di atas untuk mengambil data terbaru dari kasm.html.</div></div>`; }
function expenseDailyFlowCards(rows){
  if(!rows.length) return expenseEmpty('Belum ada alur pengeluaran bulan ini.');
  const map=new Map();
  rows.forEach(t=>{ const d=kasmDate(t)||'-'; if(!map.has(d)) map.set(d,{date:d,total:0,count:0,ops:0,other:0,items:[]}); const x=map.get(d); x.total+=Number(t.amount||0); x.count++; if(isKasmOpsExpense(t)) x.ops+=Number(t.amount||0); else x.other+=Number(t.amount||0); x.items.push(t); });
  const days=Array.from(map.values()).sort((a,b)=>b.date.localeCompare(a.date));
  return `<div class="expense-flow-grid compact-flow">${days.map(d=>`<div class="expense-day-card compact"><div class="expense-day-head"><div><div class="expense-day-title">${esc(String(d.date).slice(8,10)+'/'+String(d.date).slice(5,7))}</div><div class="expense-day-sub">${num(d.count)} data</div></div><div class="expense-day-total">Rp ${rupiah(d.total)}</div></div><div class="expense-mini-row"><span>Ops</span><b>Rp ${rupiah(d.ops)}</b></div><div class="expense-mini-row"><span>Lainnya</span><b>Rp ${rupiah(d.other)}</b></div></div>`).join('')}</div>`;
}

function expenseYearMonthCards(year=state.expenses.year){
  const y=String(year||new Date().getFullYear()).slice(0,4);
  const months=Array.from({length:12},(_,i)=>`${y}-${String(i+1).padStart(2,'0')}`);
  const totals=months.map(m=>({m,total:expenseTotal(expenseRowsForMonth(m))}));
  const highest=totals.reduce((a,b)=>b.total>a.total?b:a,totals[0]||{m:'',total:0});
  return `<div class="month-cards">${months.map(m=>{ const rows=expenseRowsForMonth(m); const total=expenseTotal(rows); const ops=expenseTotal(rows.filter(isKasmOpsExpense)); const other=total-ops; const bengkak=highest.total>0&&m===highest.m; return `<div class="month-card ${bengkak?'bengkak':''}"><div class="month-title">${esc(expenseMonthLabel(m))}${bengkak?' · Bengkak':''}</div><div class="month-row"><span>Total</span><b>Rp ${rupiah(total)}</b></div><div class="month-row"><span>Data</span><b>${num(rows.length)}</b></div><div class="month-row"><span>Ops toko</span><b>Rp ${rupiah(ops)}</b></div><div class="month-row"><span>Lainnya</span><b>Rp ${rupiah(other)}</b></div></div>`; }).join('')}</div>`;
}

function expenseYearChartCard(year=state.expenses.year){
  const y=String(year||new Date().getFullYear()).slice(0,4);
  const rows=Array.from({length:12},(_,i)=>{ const m=`${y}-${String(i+1).padStart(2,'0')}`; const items=expenseRowsForMonth(m); return {m,label:monthShort(m),total:expenseTotal(items),count:items.length}; });
  const max=Math.max(1,...rows.map(r=>r.total));
  const total=rows.reduce((a,b)=>a+b.total,0);
  const peak=rows.reduce((a,b)=>b.total>a.total?b:a,rows[0]||{label:'-',total:0,count:0});
  return `<div class="card chart-card expense-chart"><div class="chart-head"><div><div class="chart-title"><i class="fas fa-chart-column"></i> Grafik Pengeluaran ${esc(y)}</div><div class="chart-sub">Bar merah menunjukkan pengeluaran per bulan. Bulan tertinggi ditandai sebagai pengeluaran bengkak.</div></div><span class="pill warn">Bengkak: ${esc(peak.label)} · Rp ${rupiah(peak.total)}</span></div><div class="chart-bars">${rows.map(r=>{ const h=Math.max(5,Math.round((r.total/max)*120)); return `<div class="chart-col" title="${esc(monthName(r.m))}: Rp ${rupiah(r.total)} · ${num(r.count)} data"><div class="chart-bar-wrap"><div class="chart-bar" style="height:${h}px"></div></div><div class="chart-month">${esc(r.label)}</div><div class="chart-value">Rp ${rupiah(r.total)}</div></div>`; }).join('')}</div><div class="chart-legend"><span class="pill warn">Total Rp ${rupiah(total)}</span><span class="pill">${num(rows.reduce((a,b)=>a+b.count,0))} data</span><span class="pill ${peak.total>0?'warn':''}">Tertinggi ${esc(peak.label)}</span></div></div>`;
}
function financeData(type,key){
  const isYear=type==='year';
  const report=buildReport(isYear?'year':'month',key);
  const pendapatan=Number(report?.totals?.omzet||0);
  const pengeluaran=expenseTotal(isYear?expenseRowsForYear(key):expenseRowsForMonth(key));
  const omsetKotor=pendapatan-pengeluaran;
  const omsetBersih=Math.round(pendapatan*0.20)-pengeluaran;
  const limit20=Math.round(pendapatan*0.20);
  return {pendapatan,pengeluaran,omsetKotor,omsetBersih,limit20};
}
function receiptPad(label,value,width=32){
  label=String(label||'').slice(0,18);
  value=String(value||'');
  const gap=Math.max(1,width-label.length-value.length);
  return label+' '.repeat(gap)+value;
}
function buildFinanceMonthReceipt(){
  const month=String(state.finance?.month || state.expenses?.month || new Date().toISOString().slice(0,7)).slice(0,7);
  const data=financeData('month',month);
  const status=data.omsetBersih<0?'MINUS':'AMAN';
  const printedAt=new Date().toLocaleString('id-ID',{timeZone:'Asia/Jakarta'});
  const line='-'.repeat(32);
  return [
    'ROCKY LAPORAN KEUANGAN',
    'LAPORAN BULANAN',
    line,
    'Periode : '+expenseMonthLabel(month),
    'Cetak   : '+printedAt,
    'Printer : RPPO2N-F557',
    line,
    receiptPad('Pendapatan','Rp '+rupiah(data.pendapatan)),
    receiptPad('Pengeluaran','Rp '+rupiah(data.pengeluaran)),
    receiptPad('Omset Kotor','Rp '+rupiah(data.omsetKotor)),
    receiptPad('Omset Bersih','Rp '+rupiah(data.omsetBersih)),
    receiptPad('Limit 20%','Rp '+rupiah(data.limit20)),
    line,
    'Status  : '+status,
    '',
    'Terima kasih',
    '',
    '',
    ''
  ].join('\n');
}

}

}
window.loadKasmExpenses=async function(force=false){
  const y=String(state.expenses.year || state.expenses.month.slice(0,4) || new Date().getFullYear()).slice(0,4);
  state.expenses.year=y;
  if(!/^\d{4}-\d{2}$/.test(String(state.expenses.month||''))) state.expenses.month = y + '-01';
  if(!force && state.expenses.loadedYear===y){ renderExpenses(); if(state.active==='finance') renderFinance(); return; }
  state.expenses.busy=true;
  state.expenses.status=`Sync Pengeluaran tahun ${y} sedang berjalan...`;
  renderExpenses();
  renderBackup();
  if(state.active==='finance') renderFinance();
  try{
    const supa=getKasmSupabase();
    const from=`${y}-01-01`, to=`${y}-12-31`;
    const {data,error}=await supa.from('transactions').select('id,date,description,amount,type').eq('owner_id',KASM_OWNER_ID).eq('type','expense').gte('date',from).lte('date',to).order('date',{ascending:false}).order('id',{ascending:false});
    if(error) throw error;
    const syncStamp=new Date().toISOString();
    const syncMs=Date.now();
    const rows=(data||[]).map(normalizeKasmExpense).filter(t=>t.date && t.type==='expense' && !isKasmCashOut(t));
    await mobileBulkPut('kasm_expenses', rows.map(row=>({...row,id:String(row.id),source:'kasm.html',syncedFromKasmAt:syncStamp,syncedFromKasmAtMs:syncMs})));
    state.kasm_expenses=await mobileGetAll('kasm_expenses');
    state.expenses.rows=expenseRowsForYear(y);
    state.expenses.loadedYear=y;
    state.expenses.status=`${num(rows.length)} data pengeluaran tahun ${y} berhasil di-sync dari KasPribadi/KASM. Data lama di arsip HP tidak dihapus.`;
  }catch(e){
    console.error(e);
    state.expenses.status='Gagal Sync Pengeluaran dari kasm.html: '+(e.message||e);
  }finally{
    state.expenses.busy=false;
    renderExpenses();
    renderBackup();
    if(state.active==='finance') renderFinance();
    renderDashboard();
  }
};

  const year=String(ex.year||month.slice(0,4)).slice(0,4);
  const monthRows=expenseRowsForMonth(month);
  const searchedRows=filterExpenseRows(monthRows);
  const monthTotal=expenseTotal(monthRows);
  const refreshIcon=ex.busy?'fa-spinner fa-spin':'fa-rotate';
  box.innerHTML=`<div class="expense-page"><div class="data-filter-card"><div class="expense-filter-grid"><div class="field"><label>Bulan detail</label><input class="input" type="month" value="${esc(month)}" onchange="state.expenses.month=this.value;state.expenses.year=this.value.slice(0,4);renderExpenses();renderDashboard()"></div><div class="field"><label>Tahun alur</label><input class="input" type="number" value="${esc(year)}" onchange="state.expenses.year=String(this.value||new Date().getFullYear()).slice(0,4);if(!state.expenses.month.startsWith(state.expenses.year))state.expenses.month=state.expenses.year+'-01';renderExpenses();renderDashboard()"></div><div class="field"><label>Cari detail</label><input class="input" value="${esc(ex.q)}" oninput="state.expenses.q=this.value;renderExpenses()" placeholder="Cari bensin, plastik, dll"></div><button class="btn" onclick="renderExpenses()"><i class="fas fa-magnifying-glass"></i> Terapkan</button></div></div><div class="expense-note"><b>Status:</b> ${esc(ex.status)}<br>Data yang diambil: transaksi pengeluaran dengan <b>type = expense</b> dari KasPribadi/KASM, kecuali Cash Out QRIS/Tabungan. Sync Pengeluaran hanya menambah/update arsip lokal, tidak menghapus data lama.</div><div class="data-result-head"><div class="klabel"><i class="fas fa-calendar-days"></i> Alur Pengeluaran Bulanan</div><span class="pill warn">${num(monthRows.length)} data · Rp ${rupiah(monthTotal)}</span></div>${expenseDailyFlowCards(monthRows)}<div class="data-result-head"><div class="klabel"><i class="fas fa-list"></i> Detail Pengeluaran Bulan</div><span class="pill">${num(searchedRows.length)} / ${num(monthRows.length)} ditampilkan</span></div>${expenseDetailCards(monthRows)}</div>`;
}

window.loadFinanceExpenses=async function(force=false){
  state.expenses.year=String(state.finance.year||new Date().getFullYear()).slice(0,4);
  state.expenses.month=String(state.finance.month||state.expenses.year+'-01').slice(0,7);
  if(!/^\d{4}-\d{2}$/.test(state.expenses.month)) state.expenses.month=state.expenses.year+'-01';
  if(!force){
    renderFinance();
    renderDashboard();
    return;
  }
  state.expenses.busy=true;
  state.expenses.status=`Memuat data pengeluaran kasm tahun ${state.expenses.year}...`;
  renderFinance();
  renderDashboard();
  await window.loadKasmExpenses(true);
  renderFinance();
  renderDashboard();
};

function financePeakInfo(year=state.finance.year){
  const y=String(year||new Date().getFullYear()).slice(0,4);
  const rows=Array.from({length:12},(_,i)=>{ const m=`${y}-${String(i+1).padStart(2,'0')}`; const items=expenseRowsForMonth(m); return {m,label:monthShort(m),total:expenseTotal(items),count:items.length}; });
  const peak=rows.reduce((a,b)=>b.total>a.total?b:a,rows[0]||{m:'',label:'-',total:0,count:0});

function isSyncableInboxJob(j={}, importedIds=localImportedInboxJobIds()){
  const status=String(j.status||'pending').toLowerCase().trim();
  if(['deleted','cancelled','canceled'].includes(status)) return false;
  if(status==='writing') return false;
  if(['imported','done','finished','complete','completed'].includes(status)){
    // Job lama dari aplikasi admin yang pernah di-import oleh file offline versi lain
    // tetap boleh ditarik sekali di file ini. Sesudah masuk import_logs lokal, job dilewati.
    return !importedIds.has(String(j.id||''));
  }
  // pending, syncing, failed/error, dan status kosong dicoba ulang.
  return true;
}
async function getInboxSnapshot(fsMod,db){
  const col=fsMod.collection(db,INBOX_COLLECTION);
  const queries=[];
  try{ queries.push(fsMod.query(col,fsMod.orderBy('readyAtMs','desc'),fsMod.limit(INBOX_SCAN_LIMIT))); }catch(_){ }
  try{ queries.push(fsMod.query(col,fsMod.orderBy('createdAtMs','desc'),fsMod.limit(INBOX_SCAN_LIMIT))); }catch(_){ }
  queries.push(fsMod.query(col,fsMod.limit(INBOX_SCAN_LIMIT)));
  let lastErr=null;
  for(const q of queries){
    try{
      if(typeof fsMod.getDocsFromServer==='function') return await fsMod.getDocsFromServer(q);
      return await fsMod.getDocs(q);
    }catch(e){ lastErr=e; }
  }
  if(lastErr) throw lastErr;
  return await fsMod.getDocs(queries[queries.length-1]);
}
async function pendingJobs(monthKey=''){
  const {fsMod,db}=await getFirebaseSdk();
  const snap=await getInboxSnapshot(fsMod,db);
  const month=String(monthKey||'').slice(0,7);
  const importedIds=localImportedInboxJobIds();
  const jobs=snap.docs
    .map(d=>({id:d.id,...(d.data()||{})}))
    .filter(j=>j.reportLite===true || String(j.type||'').includes('rocky_report_lite') || String(j.source||'').includes('online_firebase_admin') || j.chunkCount)
    .filter(j=>isSyncableInboxJob(j,importedIds))
    .filter(j=>!month || String(j.monthKey || j.summary?.monthKey || '').slice(0,7)===month)
    .sort((a,b)=>getInboxJobTime(b)-getInboxJobTime(a));
  return jobs;
}

async function readJob(j){ const {fsMod,db}=await getFirebaseSdk(); const snap=await fsMod.getDocs(fsMod.query(fsMod.collection(db,INBOX_COLLECTION,j.id,'chunks'),fsMod.orderBy('index','asc'))); const chunks=snap.docs.map(d=>d.data()||{}).sort((a,b)=>Number(a.index||0)-Number(b.index||0)); if(Number(j.chunkCount||0)&&chunks.length<Number(j.chunkCount)) throw new Error(`Chunk belum lengkap ${chunks.length}/${j.chunkCount}`); const raw=chunks.map(c=>String(c.text||'')).join(''); if(!raw) throw new Error('Isi backup kosong'); return JSON.parse(raw); }

async function syncInboxAppendOnly(monthKey=''){
  const month=String(monthKey||'').slice(0,7);

  const jobs=allJobs.slice(0,INBOX_SYNC_LIMIT);
  if(!jobs.length) return {jobs:0,total:0,inserted:0,updated:0,deletedBeforeImport:0,remaining:0};
  let total=0,inserted=0,updated=0,deletedBeforeImport=0;
  for(const j of jobs){
    await markJob(j.id,{status:'syncing',syncingAt:new Date().toISOString(),syncingAtMs:Date.now(),appendOnly:true,importedByLiteApp:true});
    const backup=makeAppendOnlyBackup(await readJob(j));

    await markJob(j.id,{status:'imported',importedAt:new Date().toISOString(),importedAtMs:Date.now(),importedStats:res,appendOnly:true,importedByLiteApp:true});
    total+=Number(res.total||0);
    inserted+=Number(res.inserted||0);
    updated+=Number(res.updated||0);
    deletedBeforeImport+=Number(res.deletedBeforeImport||0);

}

function pusatDirectSyncYearRange(year){

function normalizePusatOriginalRow(collectionName, supabaseId, data){
  const row={...(data||{})};
  const originalId=String(row.id||'').trim();
  const docId=String(supabaseId||row.docId||row.firestoreId||row._docId||originalId||'').trim();
  // Struktur Pusat Original menyimpan data di kolom JSON `data` dengan id tabel terpisah.
  // Untuk transaksi/absen/closing/bonus, key offline harus memakai id dokumen sumber agar tidak saling timpa.
  if(collectionName==='users'){
    row.id=String(row.username||row.userId||row.uid||originalId||docId||'').trim();
    if(!row.username) row.username=row.id;
  }else{
    row.sourceId=originalId;
    row.id=docId || originalId;
  }
  row.docId=docId || row.id;
  row.firestoreId=row.docId;
  row.pusatSupabaseId=row.docId;
  const d=normalizedDateString(row.dateKey) || (collectionName==='transactions' ? '' : normalizedDateString(row.date)) || normalizedDateString(row.time) || normalizedDateString(row.createdAt);
  if(/^\d{4}-\d{2}-\d{2}$/.test(d) && !row.dateKey) row.dateKey=d;
  if(/^\d{4}-\d{2}-\d{2}$/.test(d) && !row.monthKey) row.monthKey=d.slice(0,7);
  if(!row.createdAtMs && row.createdAt && row.createdAt.seconds) row.createdAtMs=Number(row.createdAt.seconds)*1000;
  if(!row.updatedAtMs && row.updatedAt && row.updatedAt.seconds) row.updatedAtMs=Number(row.updatedAt.seconds)*1000;
  if(collectionName==='closings') normalizeClosingDeadlineSnapshot(row);
  row.syncedFromPusatOriginalAt=new Date().toISOString();
  row.syncedFromPusatOriginalAtMs=Date.now();
  row.offlineImportSource='pusat_original_supabase';
  return row;
}
async function fetchPusatOriginalCollection(collectionName,year){
  const supa=getPusatSupabase();
  const rows=[];
  const pageSize=1000;
  for(let from=0; from<PUSAT_DIRECT_SYNC_LIMIT; from+=pageSize){
    const to=from+pageSize-1;
    const {data,error}=await supa.from(collectionName).select('id,data').range(from,to);
    if(error) throw error;
    const part=(data||[]).map(r=>normalizePusatOriginalRow(collectionName,r.id,r.data||{}));
    rows.push(...part);
    if(part.length<pageSize) break;
  }
  if(collectionName==='users') return rows;
  return rows.filter(row=>{
    const y=String(year).slice(0,4);
    const isTx=row && (collectionName==='transactions' || row.amount!==undefined);
    const d=isTx ? sourceTransactionDateKey(row) : dateKey(row);
    const m=isTx ? sourceTransactionMonthKey(row) : monthKey(row);
    if(d && d.startsWith(y)) return true;
    if(m && m.startsWith(y)) return true;
    const ms=Number(row.createdAtMs||0) || asMs(row.createdAt);
    if(ms) return localDateKeyFromMs(ms).startsWith(y);
    return false;
  });
}
async function syncPusatOriginalDirect(year=''){
  const y=String(year || state.year || new Date().getFullYear()).slice(0,4);
  const data={users:[],transactions:[],attendance:[],closings:[],manualBonuses:[]};
  for(const c of PUSAT_TABLES){
    data[c]=await fetchPusatOriginalCollection(c,y);

    version:'rocky-pusat-original-supabase-readonly-v1',
    exportedAt:new Date().toISOString(),
    syncMode:'merge',
    replaceMonth:false,
    directSync:true,
    readOnlySource:true,
    appendOnly:true,
    year:y,
    data
  };
  const res=await api('/api/import-backup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({backup,directPusatOriginal:true,appendOnly:true,readOnlySource:true})});

}
window.syncAllManual=async function(){

  if(btn&&btn.disabled) return;
  const y=String(state.expenses?.year || state.year || new Date().getFullYear()).slice(0,4);

    }else{

      const c=f.counts||{};
      lines.push(`Pusat Original: ${num(f.total)} data. Baru ${num(f.inserted)}, update ${num(f.updated)}.`);
      lines.push(`Rincian: ${num(c.transactions||0)} transaksi, ${num(c.attendance||0)} absen, ${num(c.closings||0)} closing, ${num(c.manualBonuses||0)} bonus, ${num(c.users||0)} user.`);

  }
